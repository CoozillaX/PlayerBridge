name: Build and test

"on":
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake
          key: windows-x64-clang22-${{ hashFiles('xmake.lua') }}
          restore-keys: windows-x64-clang22-
      - name: Set up LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22
      - name: Check C++ formatting
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src,tests -Recurse -File | Where-Object { $_.Extension -in '.cpp','.h' } | ForEach-Object FullName)
          clang-format --dry-run --Werror @files
          if ($LASTEXITCODE -ne 0) { throw 'C++ formatting check failed' }
      - name: Configure
        run: xmake f -y -p windows -a x64 -m release --vs=2022
      - name: Build plugin and tests
        run: |
          xmake build PlayerBridge
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }
          xmake build core-tests
          if ($LASTEXITCODE -ne 0) { throw 'Core test build failed' }
          xmake build PlayerBridgeFixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed' }
      - name: Run tests
        run: |
          xmake run core-tests
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PlayerBridge-windows-x64
          path: bin/PlayerBridge/
          if-no-files-found: error
